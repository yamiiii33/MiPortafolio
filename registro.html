<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Evidencias - Crear Cuenta</title>

    <!-- CONEXIÓN PWA (Manifest) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#493653">

    <!-- Tipografía limpia: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind-config.js"></script>

    <style>
        :root {
            --mint: #BCE8D8;
            --mint-soft: #EDF9F4;
            --mint-accent: #389E82;
            --lavender: #DCCCF2;
            --lavender-soft: #F6F1FC;
            --plum: #493653;
            --ink: #1E1B24;
            --muted: #726A80;
            --line: rgba(73, 54, 83, 0.1);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #E7DFEF;
            color: var(--ink);
            margin: 0;
        }

        /* Fondo ambiental degradado (Lavanda -> Crema -> Menta) */
        .app-shell {
            max-width: 430px;
            min-height: 100vh;
            margin: 0 auto;
            background: linear-gradient(160deg, #E8D9F8 0%, #FAF7F2 45%, #DCF3EA 100%);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
            box-shadow: 0 18px 50px rgba(73, 54, 83, 0.15);
        }

        .app-shell::before {
            content: "";
            position: absolute;
            top: -50px;
            right: -50px;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(196, 170, 232, 0.85) 0%, rgba(196, 170, 232, 0) 70%);
            pointer-events: none;
            z-index: 0;
        }

        .app-shell::after {
            content: "";
            position: absolute;
            bottom: -40px;
            left: -60px;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(168, 224, 204, 0.75) 0%, rgba(168, 224, 204, 0) 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* Contenedor translúcido estilo cristal */
        .glass-panel {
            background: rgba(255, 255, 255, 0.86);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.95);
            border-radius: 26px;
            box-shadow: 0 10px 30px rgba(73, 54, 83, 0.06);
        }

        /* Inputs limpios */
        .clean-input {
            width: 100%;
            background: #F8F6FA;
            border: 1.5px solid #E5DFEC;
            border-radius: 14px;
            padding: 12px 16px 12px 42px;
            font-size: 13.5px;
            font-weight: 500;
            color: var(--ink);
            transition: all 0.2s ease;
        }

        .clean-input:focus {
            outline: none;
            border-color: var(--plum);
            background: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(220, 204, 242, 0.45);
        }

        /* Botón principal */
        .btn-primary-plum {
            width: 100%;
            background: linear-gradient(135deg, #493653 0%, #634970 100%);
            color: #FFFFFF;
            border-radius: 16px;
            padding: 13px 18px;
            font-weight: 700;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 8px 20px rgba(73, 54, 83, 0.22);
            transition: transform 0.15s ease, opacity 0.15s ease;
            cursor: pointer;
        }

        .btn-primary-plum:hover {
            opacity: 0.95;
        }

        .btn-primary-plum:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="app-shell">
        
        <!-- TOPBAR MINIMALISTA -->
        <header class="px-5 pt-5 pb-3 flex items-center justify-between relative z-10">
            <a href="index.html" class="inline-flex items-center gap-1 text-xs font-bold text-[#493653] bg-white/85 hover:bg-white px-3 py-1.5 rounded-full shadow-2xs transition-colors">
                <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
                <span>Volver al login</span>
            </a>

            <span class="text-xs font-bold text-[#389E82] bg-[#EDF9F4] border border-[#BCE8D8] px-3 py-1 rounded-full">
                Registro
            </span>
        </header>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="flex-1 px-5 pt-3 pb-8 flex flex-col justify-between relative z-10">
            
            <!-- Encabezado superior limpio -->
            <div class="mb-4 px-1">
                <h1 class="text-2xl font-extrabold text-[#1E1B24] leading-tight tracking-tight">
                    Crear cuenta
                </h1>
                <p class="text-xs text-[#726A80] mt-1 leading-relaxed max-w-[290px]">
                    Configura tus datos para empezar a guardar y organizar tus evidencias.
                </p>
            </div>

            <!-- Tarjeta translúcida de Registro -->
            <div class="glass-panel p-6">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-base font-bold text-[#1E1B24]">Datos del estudiante</h2>
                    <span class="text-[11px] font-semibold text-[#493653] bg-[#F6F1FC] px-2.5 py-0.5 rounded-full">Perfil</span>
                </div>

                <!-- Alerta de error o éxito -->
                <div id="authAlert" class="hidden mb-4 p-3 rounded-xl text-xs font-semibold flex items-start gap-2 border">
                    <i id="authAlertIcon" data-lucide="alert-circle" class="w-4 h-4 shrink-0 mt-0.5"></i>
                    <span id="authAlertText">Mensaje de validación</span>
                </div>

                <!-- Formulario de Registro -->
                <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-3.5">
                    
                    <div>
                        <label for="regName" class="block text-xs font-semibold text-[#726A80] mb-1">Nombre completo *</label>
                        <div class="relative flex items-center">
                            <i data-lucide="user" class="w-4 h-4 text-[#8E859C] absolute left-3.5 pointer-events-none"></i>
                            <input type="text" id="regName" required placeholder="Ej. Sofía Hernández" class="clean-input">
                        </div>
                    </div>

                    <div>
                        <label for="regRole" class="block text-xs font-semibold text-[#726A80] mb-1">Perfil o Carrera *</label>
                        <div class="relative flex items-center">
                            <i data-lucide="graduation-cap" class="w-4 h-4 text-[#8E859C] absolute left-3.5 pointer-events-none"></i>
                            <input type="text" id="regRole" required placeholder="Ej. Ingeniería en Software" class="clean-input">
                        </div>
                    </div>

                    <div>
                        <label for="regEmail" class="block text-xs font-semibold text-[#726A80] mb-1">Correo electrónico *</label>
                        <div class="relative flex items-center">
                            <i data-lucide="mail" class="w-4 h-4 text-[#8E859C] absolute left-3.5 pointer-events-none"></i>
                            <input type="email" id="regEmail" required placeholder="correo@ejemplo.com" class="clean-input">
                        </div>
                    </div>

                    <div>
                        <label for="regPassword" class="block text-xs font-semibold text-[#726A80] mb-1">Contraseña (mín. 6 caracteres) *</label>
                        <div class="relative flex items-center">
                            <i data-lucide="lock" class="w-4 h-4 text-[#8E859C] absolute left-3.5 pointer-events-none"></i>
                            <input type="password" id="regPassword" required minlength="6" placeholder="••••••••" class="clean-input pr-10 tracking-widest">
                            <button type="button" onclick="togglePasswordVisibility('regPassword', this)" class="absolute right-3.5 text-[#8E859C] hover:text-[#1E1B24] cursor-pointer">
                                <i data-lucide="eye" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>

                    <div>
                        <label for="regConfirmPassword" class="block text-xs font-semibold text-[#726A80] mb-1">Confirmar contraseña *</label>
                        <div class="relative flex items-center">
                            <i data-lucide="shield-check" class="w-4 h-4 text-[#8E859C] absolute left-3.5 pointer-events-none"></i>
                            <input type="password" id="regConfirmPassword" required minlength="6" placeholder="••••••••" class="clean-input pr-10 tracking-widest">
                            <button type="button" onclick="togglePasswordVisibility('regConfirmPassword', this)" class="absolute right-3.5 text-[#8E859C] hover:text-[#1E1B24] cursor-pointer">
                                <i data-lucide="eye" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>

                    <div class="pt-2">
                        <button type="submit" class="btn-primary-plum">
                            <span>Guardar y crear cuenta</span>
                            <i data-lucide="check" class="w-4 h-4 text-[#BCE8D8]"></i>
                        </button>
                    </div>
                </form>
            </div>

            <!-- Pie de página -->
            <div class="mt-6 bg-white/75 backdrop-blur-md rounded-2xl px-4 py-3.5 border border-white flex items-center justify-between">
                <span class="text-xs text-[#726A80] font-medium">¿Ya tienes una cuenta?</span>
                <a href="index.html" class="text-xs font-bold text-[#493653] bg-[#F6F1FC] hover:bg-[#DCCCF2] px-3.5 py-1.5 rounded-full transition-colors">
                    Iniciar sesión →
                </a>
            </div>
        </main>
    </div>

    <script src="js/auth.js"></script>
    <script>
        if (typeof lucide !== 'undefined') lucide.createIcons();
    </script>
</body>
</html>
