<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Evidencias - Habilidades</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#493653">
    
    <!-- Tipografía limpia: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind-config.js"></script>

    <style>
        :root {
            --mint: #BCE8D8;
            --mint-soft: #EDF9F4;
            --mint-accent: #389E82;
            --lavender: #DCCCF2;
            --lavender-soft: #F6F1FC;
            --plum: #493653;
            --ink: #1E1B24;
            --muted: #726A80;
            --line: rgba(73, 54, 83, 0.1);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #E7DFEF;
            color: var(--ink);
            margin: 0;
        }

        .app-shell {
            max-width: 430px;
            min-height: 100vh;
            margin: 0 auto;
            background: linear-gradient(165deg, #EFE5FA 0%, #FAF7F2 42%, #E8F7F1 100%);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
            box-shadow: 0 18px 50px rgba(73, 54, 83, 0.14);
        }

        .app-shell::before {
            content: "";
            position: absolute;
            top: -60px;
            right: -60px;
            width: 240px;
            height: 240px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(220, 204, 242, 0.75) 0%, rgba(220, 204, 242, 0) 70%);
            pointer-events: none;
            z-index: 0;
        }

        .app-shell::after {
            content: "";
            position: absolute;
            top: 380px;
            left: -70px;
            width: 240px;
            height: 240px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(188, 232, 216, 0.55) 0%, rgba(188, 232, 216, 0) 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* Convertir #lista-blandas y #lista-tecnicas en listado vertical limpio */
        #lista-blandas,
        #lista-tecnicas {
            display: flex !important;
            flex-direction: column !important;
            gap: 8px !important;
        }

        #lista-blandas > div,
        #lista-blandas > span,
        #lista-tecnicas > div,
        #lista-tecnicas > span {
            width: 100% !important;
            background: rgba(255, 255, 255, 0.85) !important;
            backdrop-filter: blur(8px) !important;
            border: 1px solid rgba(255, 255, 255, 0.95) !important;
            border-radius: 14px !important;
            padding: 12px 16px !important;
            font-size: 13px !important;
            font-weight: 600 !important;
            color: var(--ink) !important;
            box-shadow: 0 3px 10px rgba(73, 54, 83, 0.04) !important;
            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;
        }

        #lista-blandas > div {
            border-left: 4px solid #7C5C8E !important;
        }

        #lista-tecnicas > div {
            border-left: 4px solid #389E82 !important;
        }

        .bottom-nav-clean {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 430px;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(14px);
            border-top: 1px solid var(--line);
            padding: 10px 16px 14px 16px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 40;
        }

        .nav-tab {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 500;
            color: #8E859C;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .nav-tab.active {
            color: var(--plum);
            font-weight: 700;
        }

        .nav-tab.active .nav-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--mint-accent);
        }

        .clean-input {
            width: 100%;
            background: #F8F6FA;
            border: 1.5px solid #E5DFEC;
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 13px;
            color: var(--ink);
        }
        .clean-input:focus {
            outline: none;
            border-color: var(--plum);
            background: #FFFFFF;
        }
    </style>
</head>
<body>

    <div class="app-shell">
        
        <!-- TOPBAR MINIMALISTA -->
        <header class="px-5 pt-5 pb-3 flex items-center justify-between border-b border-[#493653]/10 sticky top-0 bg-white/60 backdrop-blur-md z-30">
            <a href="perfil-usuario.html" class="inline-flex items-center gap-1 text-xs font-bold text-[#493653] bg-white/80 hover:bg-white px-2.5 py-1.5 rounded-full shadow-2xs transition-colors">
                <i data-lucide="chevron-left" class="w-3.5 h-3.5"></i>
                <span>Perfil</span>
            </a>

            <span class="text-sm font-bold text-[#1E1B24] tracking-tight">Habilidades</span>

            <button type="button" onclick="openModal()" class="admin-only text-xs font-bold text-white bg-[#493653] hover:opacity-90 px-3 py-1.5 rounded-full flex items-center gap-1 shadow-xs transition-opacity cursor-pointer">
                <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                <span>Agregar</span>
            </button>
        </header>

        <!-- CONTENIDO PRINCIPAL EN LISTADO VERTICAL -->
        <main class="flex-1 px-5 pt-5 pb-28 flex flex-col gap-6 relative z-10">

            <!-- Tarjeta encabezado limpia -->
            <div class="bg-white/75 backdrop-blur-md rounded-2xl p-4 border border-white flex items-center justify-between">
                <div>
                    <h1 class="text-lg font-extrabold text-[#1E1B24] leading-tight">Mis Habilidades</h1>
                    <p class="text-xs text-[#726A80] mt-0.5">Competencias personales y dominio técnico</p>
                </div>
                <div class="w-10 h-10 rounded-2xl bg-[#F6F1FC] text-[#493653] flex items-center justify-center shrink-0">
                    <i data-lucide="sparkles" class="w-5 h-5"></i>
                </div>
            </div>

            <!-- Sección Habilidades Blandas -->
            <section>
                <div class="flex items-center justify-between mb-2.5 px-1">
                    <h2 class="text-sm font-bold text-[#1E1B24]">Habilidades Blandas</h2>
                    <span class="text-[10px] font-bold text-[#493653] bg-[#F6F1FC] px-2.5 py-0.5 rounded-full">Soft Skills</span>
                </div>
                <div id="lista-blandas"></div>
            </section>

            <!-- Sección Habilidades Técnicas -->
            <section>
                <div class="flex items-center justify-between mb-2.5 px-1">
                    <h2 class="text-sm font-bold text-[#1E1B24]">Habilidades Técnicas</h2>
                    <span class="text-[10px] font-bold text-[#389E82] bg-[#EDF9F4] px-2.5 py-0.5 rounded-full">Hard Skills</span>
                </div>
                <div id="lista-tecnicas"></div>
            </section>

        </main>

        <!-- BARRA INFERIOR MINIMALISTA -->
        <nav class="bottom-nav-clean">
            <a href="perfil-usuario.html" class="nav-tab active">
                <i data-lucide="user" class="w-5 h-5"></i>
                <span>Perfil</span>
                <span class="nav-dot"></span>
            </a>
            <a href="ProyectosPracticas.html" class="nav-tab">
                <i data-lucide="folder-kanban" class="w-5 h-5"></i>
                <span>Proyectos</span>
            </a>
            <a href="ExperienciaLaboral.html" class="nav-tab">
                <i data-lucide="briefcase" class="w-5 h-5"></i>
                <span>Trayectoria</span>
            </a>
            <a href="InteresMetas.html" class="nav-tab">
                <i data-lucide="compass" class="w-5 h-5"></i>
                <span>Metas</span>
            </a>
        </nav>

        <!-- MODAL: NUEVA HABILIDAD (IDS INTACTOS PARA HABILIDADES.JS) -->
        <div id="addSkillModal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4 backdrop-blur-sm">
            <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl flex flex-col">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-base font-bold text-[#1E1B24]">Agregar Habilidad</h3>
                    <button type="button" onclick="closeModal()" class="p-1.5 rounded-full hover:bg-gray-100 text-[#726A80]">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                </div>

                <form id="addSkillForm" class="flex flex-col gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-[#726A80] mb-1.5">Tipo de Habilidad</label>
                        <div class="grid grid-cols-2 gap-2.5">
                            <label class="cursor-pointer relative">
                                <input type="radio" name="skillType" value="blanda" class="peer sr-only" checked>
                                <div class="w-full text-center py-2.5 rounded-xl border border-[#E5DFEC] bg-[#F8F6FA] text-[#726A80] text-xs font-bold transition-all peer-checked:border-[#493653] peer-checked:bg-[#493653] peer-checked:text-white">
                                    Blanda
                                </div>
                            </label>
                            <label class="cursor-pointer relative">
                                <input type="radio" name="skillType" value="tecnica" class="peer sr-only">
                                <div class="w-full text-center py-2.5 rounded-xl border border-[#E5DFEC] bg-[#F8F6FA] text-[#726A80] text-xs font-bold transition-all peer-checked:border-[#389E82] peer-checked:bg-[#389E82] peer-checked:text-white">
                                    Técnica
                                </div>
                            </label>
                        </div>
                    </div>

                    <div>
                        <label for="skillName" class="block text-xs font-semibold text-[#726A80] mb-1">Nombre de la habilidad</label>
                        <input type="text" id="skillName" required placeholder="Ej. Liderazgo, HTML5, JavaScript..." class="clean-input">
                    </div>

                    <button type="submit" class="mt-2 w-full bg-[#493653] text-white font-bold text-xs py-3.5 rounded-xl shadow-sm flex items-center justify-center gap-2 transition-transform active:scale-95 cursor-pointer">
                        <i data-lucide="check" class="w-4 h-4"></i>
                        <span>Guardar Habilidad</span>
                    </button>
                </form>
            </div>
        </div>

    </div>

    <script src="js/habilidades.js"></script>
    <script>
        if (typeof lucide !== 'undefined') lucide.createIcons();
    </script>
</body>
</html>
